name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: docker build -t ai-text-api:ci backend
      - name: Container smoke test
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 ai-text-api:ci
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://localhost:8000/health
      - name: Cleanup
        if: always()
        run: docker rm -f api || true
