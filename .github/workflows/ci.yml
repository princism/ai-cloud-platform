
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Ruff check
        run: ruff check app tests
        working-directory: backend

      - name: Pytest
        run: python -m pytest -q
        working-directory: backend

      - name: Docker build
        run: docker build -t ai-text-api:ci backend

      - name: Container smoke test
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 ai-text-api:ci

          curl --retry 30 \
               --retry-all-errors \
               --retry-delay 1 \
               --connect-timeout 2 \
               --max-time 5 \
               --fail \
               --show-error \
               http://127.0.0.1:8000/health

      - name: Show container logs on failure
        if: failure()
        run: docker logs api || true

      - name: Cleanup
        if: always()
        run: docker rm -f api || true
        